services:
  nginx-app:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-app-1
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      - DB_MYSQL_HOST=nginx-db
      - DB_MYSQL_PORT=3306
      - DB_MYSQL_USER=npm
      - DB_MYSQL_PASSWORD=${NPM_DB_PASSWORD:-npm_password}
      - DB_MYSQL_NAME=npm
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx-db
    labels:
      - glance.hide=false
      - glance.name=Nginx Proxy Manager
      - glance.icon=sh:nginx-proxy-manager-light
      - glance.url=http://10.0.0.50:81
      - glance.description=Reverse Proxy & SSL Manager

  nginx-db:
    image: jc21/mariadb-aria:latest
    container_name: nginx-db-1
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=npm
      - MYSQL_USER=npm
      - MYSQL_PASSWORD=${NPM_DB_PASSWORD:-npm_password}
    volumes:
      - ./mysql:/var/lib/mysql
