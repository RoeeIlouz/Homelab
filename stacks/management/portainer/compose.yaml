services:
  portainer:
    image: portainer/portainer-ee:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - glance.hide=false
      - glance.name=Portainer
      - glance.icon=sh:portainer-light
      - glance.url=https://10.0.0.50:9443
      - glance.description=Portainer Enterprise Container Manager

volumes:
  portainer_data:
