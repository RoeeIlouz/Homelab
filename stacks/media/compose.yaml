# ==============================================================================
# MEDIA & ENTERTAINMENT STACK (*ARR + JELLYFIN + GLUETUN VPN)
# ==============================================================================
# Complete automated media server pipeline routed securely through a VPN killswitch.
# 
# Traffic Flow:
#  [Internet] -> [Gluetun VPN Gateway] <-> [qBittorrent / Deluge / NZBGet / Prowlarr / FlareSolverr]
#  [Local Network / Reverse Proxy] -> [Jellyfin / Jellyseerr / Sonarr / Radarr / Lidarr / Bazarr]
# ==============================================================================

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:
  # ----------------------------------------------------------------------------
  # VPN GATEWAY & KILL-SWITCH
  # ----------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # qBittorrent Web UI & Torrent Port
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
      - "681:6881"
      - "681:6881/udp"
      # NZBGet Web UI
      - "6789:6789"
      # Prowlarr Web UI
      - "9696:9696"
      # Deluge Web UI & Daemon
      - "8112:8112"
      - "58846:58846"
      # FlareSolverr Web UI
      - "8191:8191"
    volumes:
      - ${STORAGE_ROOT}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-airvpn}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Switzerland}
      - FIREWALL_VPN_INPUT_PORTS=${VPN_FORWARDED_PORT:-6881}
      - HEALTH_VPN_DURATION_INITIAL=${HEALTH_VPN_DURATION_INITIAL:-30s}
    healthcheck:
      test: ping -c 1 1.1.1.1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.2

  # Auto-restarts services if VPN health check fails
  deunhealth:
    image: qmcgaw/deunhealth:latest
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # ----------------------------------------------------------------------------
  # DOWNLOAD CLIENTS (ROUTED THROUGH GLUETUN VPN)
  # ----------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=${VPN_FORWARDED_PORT:-6881}
    volumes:
      - ${STORAGE_ROOT}/qbittorrent:/config
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
      - ${MEDIA_DATA_ROOT}/data:/data
    labels:
      - deunhealth.restart.on.unhealthy=true
      - glance.hide=false
      - glance.name=qBittorrent
      - glance.icon=sh:qbittorrent-light
      - glance.url=http://10.0.0.50:8080
      - glance.description=Torrent client (VPN protected)
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - DELUGE_LOGLEVEL=error
    volumes:
      - ${STORAGE_ROOT}/deluge:/config
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
      - ${MEDIA_DATA_ROOT}/data:/data
    labels:
      - glance.hide=false
      - glance.name=Deluge
      - glance.icon=sh:deluge-light
      - glance.url=http://10.0.0.50:8112
      - glance.description=Torrent client
    restart: unless-stopped

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - NZBGET_USER=${NZBGET_USER:-admin}
      - NZBGET_PASS=${NZBGET_PASS:-adminpassword}
    volumes:
      - ${STORAGE_ROOT}/nzbget:/config
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
      - ${MEDIA_DATA_ROOT}/data:/data
    labels:
      - glance.hide=false
      - glance.name=NZBGet
      - glance.icon=sh:nzbget-light
      - glance.description=Usenet NZB downloader
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${STORAGE_ROOT}/prowlarr:/config
    labels:
      - glance.hide=false
      - glance.name=Prowlarr
      - glance.icon=sh:prowlarr-light
      - glance.url=http://10.0.0.50:9696
      - glance.description=Torrent & Usenet Indexer Manager
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # AUTOMATION MANAGERS (*ARR SUITE)
  # ----------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${STORAGE_ROOT}/sonarr:/config
      - ${MEDIA_DATA_ROOT}/data:/data
      - ${MEDIA_DATA_ROOT}/tv:/tv
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
    ports:
      - "8989:8989"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.3
    labels:
      - glance.hide=false
      - glance.name=Sonarr
      - glance.icon=sh:sonarr-light
      - glance.url=http://10.0.0.50:8989
      - glance.description=TV Show Management
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${STORAGE_ROOT}/radarr:/config
      - ${MEDIA_DATA_ROOT}/data:/data
      - ${MEDIA_DATA_ROOT}/movies:/movies
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
    ports:
      - "7878:7878"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.4
    labels:
      - glance.hide=false
      - glance.name=Radarr
      - glance.icon=sh:radarr-light
      - glance.url=http://10.0.0.50:7878
      - glance.description=Movie Management
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${STORAGE_ROOT}/lidarr:/config
      - ${MEDIA_DATA_ROOT}/data:/data
      - ${MEDIA_DATA_ROOT}/music:/music
      - ${MEDIA_DATA_ROOT}/downloads:/downloads
    ports:
      - "8686:8686"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.5
    labels:
      - glance.hide=false
      - glance.name=Lidarr
      - glance.icon=sh:lidarr-light
      - glance.url=http://10.0.0.50:8686
      - glance.description=Music Management
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${STORAGE_ROOT}/bazarr:/config
      - ${MEDIA_DATA_ROOT}/movies:/movies
      - ${MEDIA_DATA_ROOT}/tv:/tv
    ports:
      - "6767:6767"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.6
    labels:
      - glance.hide=false
      - glance.name=Bazarr
      - glance.icon=sh:bazarr-light
      - glance.url=http://10.0.0.50:6767
      - glance.description=Subtitle Management
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # MEDIA STREAMING & USER REQUESTS
  # ----------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=http://10.0.0.50:8096
    volumes:
      - ${STORAGE_ROOT}/jellyfin:/config
      - ${MEDIA_DATA_ROOT}/tv:/data/tvshows
      - ${MEDIA_DATA_ROOT}/movies:/data/movies
      - ${MEDIA_DATA_ROOT}/music:/data/music
    ports:
      - "8096:8096"
      - "8920:8920"
      - "1900:1900/udp"
      - "7359:7359/udp"
    labels:
      - glance.hide=false
      - glance.name=Jellyfin
      - glance.icon=sh:jellyfin-light
      - glance.url=http://10.0.0.50:8096
      - glance.description=Open Source Media Streaming Server
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
    volumes:
      - ${STORAGE_ROOT}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.9
    labels:
      - glance.hide=false
      - glance.name=Jellyseerr
      - glance.icon=sh:jellyseerr-light
      - glance.url=http://10.0.0.50:5055
      - glance.description=Media Request Management
    restart: unless-stopped
