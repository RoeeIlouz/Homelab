- name: Home
  hide-desktop-navigation: true
  head-widgets: 
    - type: search
      search-engine: google
      bangs:
        - title: YouTube
          shortcut: "!yt"
          url: https://www.youtube.com/results?search_query={QUERY}
        - title: Perplexity
          shortcut: "!p"
          url: https://www.perplexity.ai/search?q={QUERY}
        - title: DuckDuckGo
          shortcut: "!ddg"
          url: https://www.duckduckgo.com/?q={QUERY}
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday
        - type: releases
          cache: 1d
          repositories:
            - glanceapp/glance
            - immich-app/immich
            - syncthing/syncthing
            - files-community/Files
            - ChrisTitusTech/winutil
            - DioxusLabs/dioxus
            - brave/brave-browser
    - size: full
      widgets:
        - type: bookmarks
          groups:
            - title: General
              same-tab: true
              hide-arrow: true
              links:
                - title: Gmail
                  url: https://mail.google.com/mail/u/0/
                - title: GitHub
                  url: https://github.com/
            - title: Entertainment
              same-tab: true
              hide-arrow: true
              color: 10 70 50
              links:
                - title: Netflix
                  url: https://www.netflix.com/
                - title: Disney+
                  url: https://www.disneyplus.com/
                - title: YouTube
                  url: https://www.youtube.com/
                - title: Prime Video
                  url: https://www.primevideo.com/
        - type: docker-containers
          hide-by-default: true
        - type: videos
          channels:
            - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
            - UCeeFfhMcJa1kjtfZAGskOCA # TechLinked
            - UCdBK94H6oZT2Q7l0-b0xmMg # ShortCircuit
            - UCjgpFI5dU-D1-kh9H1muoxQ # The Hacksmith
            - UCg6gPGh8HU2U01vaFCAsvmQ # ChrisTitusTech
    - size: small
      widgets:
        - type: weather
          location: Jerusalem, Israel
          units: metric
          hour-format: 24h
        - type: group
          widgets:
            - type: reddit
              subreddit: technology
              show-thumbnails: true
              limit: 15
              collapse-after: 2
              style: vertical-list
            - type: reddit
              subreddit: selfhosted
              show-thumbnails: true
              limit: 15
              collapse-after: 2
              style: vertical-list
            - type: reddit
              subreddit: pcmasterrace
              show-thumbnails: true
              limit: 15
              collapse-after: 2
              style: vertical-list
